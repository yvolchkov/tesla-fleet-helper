  tesla_http_proxy:
    image: tesla/vehicle-command:latest
    ports:
      - "4443:4443"
    environment:
      - TESLA_HTTP_PROXY_TLS_CERT=/certs/fullchain.pem
      - TESLA_HTTP_PROXY_TLS_KEY=/certs/private.pem
      - TESLA_HTTP_PROXY_HOST=0.0.0.0
      - TESLA_HTTP_PROXY_PORT=4443
      - TESLA_HTTP_PROXY_TIMEOUT=10s
      - TESLA_KEY_FILE=/config/fleet-key.pem
      - TESLA_VERBOSE=true
    volumes:
      - ./proxy-config:/config
      - ./acme/fleet.volch.org_ecc/fullchain.cer:/certs/fullchain.pem:ro
      - ./acme/fleet.volch.org_ecc/fleet.volch.org.key:/certs/private.pem:ro
      - ./secrets/private-key.pem:/config/fleet-key.pem:ro

  telemetry:
    image: tesla/fleet-telemetry:latest
    container_name: tesla-fleet-telemetry
    restart: unless-stopped
    volumes:
      - ./telemetry-config.json:/etc/fleet-telemetry/config.json:ro
      - ./acme/telemetry.volch.org_ecc/fullchain.cer:/certs/fullchain.pem:ro
      - ./acme/telemetry.volch.org_ecc/telemetry.volch.org.key:/certs/private.pem:ro
    ports:
      - 35626:35626